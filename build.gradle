import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = "${mod_version}"
group = "${mod_group_id}"

// ────────────────────────────────────────────────────────────────────────
// Pinned Modrinth dependencies (CRN / DragonLib) — exact Forge builds
//
// The Modrinth Maven endpoint (https://api.modrinth.com/maven) resolves by
// version number and serves the first file of that version, which for
// multi-loader releases is NOT necessarily the Forge build (we previously
// pulled the wrong variant this way). To pin the exact artifact, the
// installModrinthDeps task below fetches the file by Modrinth *version ID*
// via the REST API and installs it into the project-local Maven repository
// `local-maven/`.
//
// Pinned version pages:
//   CRN:       https://modrinth.com/mod/create-railways-navigator/version/r5q4MIYy
//   DragonLib: https://modrinth.com/mod/dragonlib/version/RWduTzyi
//
// To update: change the versionId here AND the version in gradle.properties.
// ────────────────────────────────────────────────────────────────────────
def modrinthPins = [
        [project: "create-railways-navigator", versionId: "r5q4MIYy",
         group: "com.local", artifact: "create-railways-navigator", version: crn_version],
        [project: "dragonlib", versionId: "RWduTzyi",
         group: "com.local", artifact: "dragonlib", version: dragonlib_version],
]
def localMavenDir = new File(projectDir, "local-maven")
def modrinthPinArtifacts = modrinthPins.collect { pin ->
    def dir = new File(localMavenDir, pin.group.replace('.', '/') + '/' + pin.artifact + '/' + pin.version)
    [dir: dir,
     jar: new File(dir, pin.artifact + '-' + pin.version + '.jar'),
     pom: new File(dir, pin.artifact + '-' + pin.version + '.pom')]
}

repositories {
    mavenCentral()

    // CRN / DragonLib: local-maven/ (populated by the installModrinthDeps task)
    exclusiveContent {
        forRepository {
            maven {
                name = "LocalModrinth"
                url = localMavenDir
            }
        }
        filter {
            includeGroup "com.local"
        }
    }

    // Modrinth 仓库 (官方推荐写法)
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// Mixin 配置 (1.20.1 / Forge 47 需要 refmap)
mixin {
    add(sourceSets.main, "crndisplaynext.refmap.json")
    config "crndisplaynext.mixins.json"
}

// ── installModrinthDeps: 下载锁定的 Modrinth Forge 构建到 local-maven/ ──
def openWithTimeout = { URL u ->
    def conn = u.openConnection()
    conn.connectTimeout = 30000
    conn.readTimeout = 300000
    return conn
}

def installOnePin = { pin, out ->
    def metaUrl = "https://api.modrinth.com/v2/project/${pin.project}/version/${pin.versionId}"
    def metaText
    openWithTimeout(new URL(metaUrl)).inputStream.withCloseable { ins ->
        metaText = ins.getText("UTF-8")
    }
    def meta = new JsonSlurper().parseText(metaText)
    if (meta.version_number != pin.version) {
        throw new GradleException("Modrinth ${pin.project}@${pin.versionId} version mismatch: expected ${pin.version}, got ${meta.version_number}")
    }
    def file = (meta.files ?: []).find { it.primary }
    if (file == null) {
        throw new GradleException("Modrinth ${pin.project}@${pin.versionId} has no primary file")
    }
    def jar = out.jar
    if (jar.exists() && jar.length() == file.size) {
        logger.lifecycle("[modrinth-pin] ${pin.group}:${pin.artifact}:${pin.version} already up to date")
    } else {
        logger.lifecycle("[modrinth-pin] downloading ${pin.group}:${pin.artifact}:${pin.version} (${file.size} bytes)")
        jar.parentFile.mkdirs()
        def tmp = new File(jar.parentFile, jar.name + '.part')
        def dlIns = openWithTimeout(new URL(file.url)).inputStream
        try {
            java.nio.file.Files.copy(dlIns, tmp.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            dlIns.close()
        }
        if (tmp.length() != file.size) {
            tmp.delete()
            throw new GradleException("Size mismatch downloading ${pin.artifact}: expected ${file.size}, got ${tmp.length()}")
        }
        if (jar.exists()) { jar.delete() }
        tmp.renameTo(jar)
    }
    if (!out.pom.exists()) {
        out.pom.parentFile.mkdirs()
        out.pom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${pin.group}</groupId>
  <artifactId>${pin.artifact}</artifactId>
  <version>${pin.version}</version>
  <packaging>jar</packaging>
</project>
"""
    }
}

tasks.register("installModrinthDeps") {
    group = "modding"
    description = "Fetches the pinned Modrinth Forge builds (by version ID) into local-maven/."
    outputs.files(modrinthPinArtifacts.collectMany { [it.jar, it.pom] })
    doLast {
        modrinthPins.eachWithIndex { pin, i ->
            installOnePin(pin, modrinthPinArtifacts[i])
        }
    }
}

// Ensure the pinned jars exist before anything resolves them
tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named("installModrinthDeps")
}
tasks.matching { it.name == "test" || it.name.startsWith("run") }.configureEach {
    dependsOn tasks.named("installModrinthDeps")
}

// ── Dual-loader note ─────────────────────────────────────────────────
// We build against the common Forge 47 API. NeoForge 1.20.1
// (net.neoforged:forge 1.20.1-47.1.x) is a continuation of the same
// Forge 47 codebase and still registers as modId "forge", so the single
// produced jar works on BOTH Forge and NeoForge for 1.20.1 — same as CRN.
legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Mixin annotation processor -> generates crndisplaynext.refmap.json
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 1.20.1 / Forge 47 依赖矩阵

    // CRN / DragonLib (1.20.1 Forge, 按 Modrinth version ID 精确锁定)
    // 来源: local-maven/ (由 installModrinthDeps 任务下载, 见文件顶部说明)
    modCompileOnly "com.local:create-railways-navigator:${crn_version}"
    modRuntimeOnly "com.local:create-railways-navigator:${crn_version}"
    modCompileOnly "com.local:dragonlib:${dragonlib_version}"
    modRuntimeOnly "com.local:dragonlib:${dragonlib_version}"
    // Create 1.20.1 运行时依赖 Ponder / Flywheel（Forge 1.20.1 变体）
    modCompileOnly "net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}"
    modRuntimeOnly "net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}"
    modCompileOnly "maven.modrinth:create:mc1.20.1-${create_version}"
    modRuntimeOnly "maven.modrinth:create:mc1.20.1-${create_version}"
}

configurations.configureEach {
    resolutionStrategy.force "net.sf.jopt-simple:jopt-simple:5.0.4"
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            java_version           : java_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'        : 'crndisplaynext.mixins.json',
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}