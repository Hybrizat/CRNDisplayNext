modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mixins]]
config = "crndisplaynext.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
${mod_description}
'''
logoFile = "crndisplaynext.png"
authors = "${mod_authors}"
displayURL = "https://github.com/hybrizat/crndisplaynext"

[[dependencies.crndisplaynext]]
# Loader dependency. NeoForge 1.20.1 registers itself as modId "forge" as well,
# so this single jar loads on both Forge and NeoForge (1.20.1 shares the Forge 47 API).
# "mandatory" is required by Forge 1.20.1; "type" is required by NeoForge. Keep both.
modId = "forge"
mandatory = true
type = "required"
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.crndisplaynext]]
modId = "minecraft"
mandatory = true
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.crndisplaynext]]
modId = "create"
mandatory = true
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.crndisplaynext]]
# Create: Train Navigator
modId = "createrailwaysnavigator"
mandatory = true
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
